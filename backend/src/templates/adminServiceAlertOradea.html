<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; background-color: #0b1020; color: #ffffff; padding: 20px; }
        .card { background: #0f172a; border: 2px solid #818cf8; border-radius: 15px; padding: 20px; max-width: 600px; margin: auto; }
        .header { color: #818cf8; font-size: 18px; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
        .label { color: #94a3b8; font-size: 11px; text-transform: uppercase; margin-top: 15px; }
        .value { color: #ffffff; font-size: 16px; font-weight: bold; }
        .issue { background: rgba(129, 140, 248, 0.1); border: 1px solid #818cf8; padding: 10px; border-radius: 8px; color: #a5b4fc; margin-top: 10px; font-style: italic; }
        .address-box { background: #1e293b; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #818cf8; }
        .btn { display: inline-block; padding: 10px 20px; background: #818cf8; color: #ffffff; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">📍 RIDICARE PERSONALĂ: ORADEA</div>
        
        <div class="label">Produs & ID Comandă:</div>
        <div class="value">{{productName}} (#{{orderId}})</div>

        <div class="label">Client:</div>
        <div class="value">{{customerName}}</div>
        <div class="value"><a href="tel:{{customerPhone}}" style="color: #818cf8;">{{customerPhone}}</a></div>

        <div class="label">Defect Reclamat:</div>
        <div class="issue">"{{issueDescription}}"</div>

        <div class="label">Locație în Oradea:</div>
        <div class="address-box">
            📍 {{address}}
        </div>

        <div class="label">Data dorită:</div>
        <div class="value" style="color: #818cf8;">{{preferredDate}}</div>

        <p style="font-size: 12px; color: #64748b; margin-top: 15px;">Sună clientul pentru a stabili ora exactă a vizitei.</p>

        <a href="https://karixcomputers.ro/admin/service" class="btn">VEZI ÎN ADMIN</a>
    </div>
</body>
</html>
